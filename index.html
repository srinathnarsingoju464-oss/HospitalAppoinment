
<!DOCTYPE html>
<html>
<head>
    <title>Hospital Appointment</title>
    <style>
        body {
            font-family: Arial;
            background-color: #eaf6ff;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>ABC Hospital</h1>
    <h2>Doctor Appointment Details</h2>

    <table>
        <tr>
            <th>Doctor Name</th>
            <th>Specialization</th>
            <th>Available Timings</th>
        </tr>

        <tr>
            <td>Dr. Ravi</td>
            <td>Cardiologist</td>
            <td>9 AM - 12 PM</td>
        </tr>

        <tr>
            <td>Dr. Priya</td>
            <td>Dermatologist</td>
            <td>10 AM - 1 PM</td>
        </tr>

        <tr>
            <td>Dr. Kumar</td>
            <td>Neurologist</td>
            <td>2 PM - 5 PM</td>
        </tr>
    </table>

</body>
</html>
